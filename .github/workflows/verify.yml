name: Idol site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check studio.js
      - name: Verify site content and interactions
        run: node --test tests/*.test.mjs
      - name: Check site assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s studio.html
          test -s studio.js
          test -s studio.css
          grep -q 'studio.js' studio.html
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
          grep -q 'id="artistes"' index.html
          grep -q 'id="musique"' index.html
          grep -q 'id="performances"' index.html
          grep -q 'id="fans"' index.html
